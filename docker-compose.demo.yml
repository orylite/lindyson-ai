# 一键试玩叠加文件，与 .env.demo 配合使用：
#
#   docker compose --env-file .env.demo -f docker-compose.yml -f docker-compose.demo.yml up -d --build
#
# .env.demo 负责把栈切到开发模式并开启假供应商（生成任务约 1.5 秒后返回占位结果）；
# 这个文件只做一件事：让 migrate 容器在跑完数据库迁移后，顺带写入套餐种子并创建演示管理员，
# 这样 `up` 结束就能直接登录，不用再敲第二条命令。
#
# 正式部署不要带这个文件，也不要用 .env.demo。

services:
  migrate:
    command:
      - sh
      - -c
      - >-
        npm --workspace apps/api run db:migrate:prod
        && npm --workspace apps/api run db:seed:prod
        && npm --workspace apps/api run db:bootstrap-admin:prod

  web:
    # 演示栈只监听本机回环地址，避免局域网内其他机器用演示账号访问。
    ports: !override
      - "127.0.0.1:${WEB_HTTP_PORT:-8080}:80"
