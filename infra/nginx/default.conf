map $uri $lindyson_access_loggable {
  default 1;
  ~^/(oauth|mcp/authorize|api/mcp/interaction)(?:/|$) 0;
  ~^/portrait-consent/(invite|authorization)(?:/|$) 0;
  ~^/api/public/real-portrait-(invites|authorizations)/ 0;
  ~^/api/providers/volc/real-portrait-validation/ 0;
}

server {
  listen 80;
  server_name _;

  client_max_body_size 1g;
  access_log /var/log/nginx/access.log combined if=$lindyson_access_loggable;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https:; form-action 'self' https:" always;

  location ~ ^/(mcp$|oauth(?:/|$)|\.well-known/oauth-) {
    proxy_pass http://api:4300;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
    proxy_read_timeout 120s;
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
  }

  location /api/ {
    proxy_pass http://api:4300/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_request_buffering off;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
  }

  location = / {
    root /usr/share/nginx/html;
    add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
    try_files /index.html =404;
  }

  location = /index.html {
    root /usr/share/nginx/html;
    add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
    try_files $uri =404;
  }

  location = /app.html {
    internal;
    root /usr/share/nginx/html;
    add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    try_files $uri =404;
  }

  location = /robots.txt {
    root /usr/share/nginx/html;
    add_header Cache-Control "public, max-age=3600" always;
    try_files $uri =404;
  }

  location = /sitemap.xml {
    root /usr/share/nginx/html;
    add_header Cache-Control "public, max-age=3600" always;
    try_files $uri =404;
  }

  location = /version.json {
    root /usr/share/nginx/html;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    try_files $uri =404;
  }

  location ^~ /assets/ {
    root /usr/share/nginx/html;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location ~ ^/(portrait-consent/|mcp/authorize$) {
    root /usr/share/nginx/html;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https:; form-action 'self' https:" always;
    # 直接在当前敏感路由上下文提供 SPA 壳，避免内部跳转到 /app.html 后丢失 no-store/no-referrer。
    try_files /app.html =404;
  }

  location / {
    root /usr/share/nginx/html;
    add_header X-Robots-Tag "noindex, nofollow" always;
    try_files $uri $uri/ /app.html;
  }
}
